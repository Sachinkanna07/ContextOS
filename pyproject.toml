[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextos-memory-runtime"
version = "1.0.0rc4"
description = "Local-first personal AI memory runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "ContextOS Contributors" },
]
keywords = ["ai", "memory", "rag", "local-first", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "aiosqlite>=0.20.0",
    "tiktoken>=0.7.0",
    "sqlite-vec>=0.1.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
tui = [
    "textual>=0.79.0",
]
lancedb = [
    "lancedb>=0.12.0",
]

[project.scripts]
contextos = "contextos.cli.app:main"
contextos-mcp = "contextos.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextos"]

[tool.hatch.build]
exclude = [
    "**/.kilo/**", "**/.git/**", "**/.venv/**", "**/venv/**",
    "**/.pytest_cache/**", "**/__pycache__/**", "**/.mypy_cache/**", "**/.ruff_cache/**",
    "**/.idea/**", "**/.vscode/**", "**/worktrees/**", "**/checkouts/**",
    "**/dist/**", "**/build/**", "**/*.pyc", "**/*.db", "**/*.db-*",
    "**/*.sqlite", "**/*.sqlite3", "**/.env", "**/.env.*", "**/*scratch*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/contextos/**", "/tests/**", "/docs/**", "/tools/validate_release_artifacts.py",
    "/README.md", "/CHANGELOG.md", "/pyproject.toml", "/Makefile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "adversarial: Adversarial/security tests",
    "benchmark: Benchmark tests",
    "slow: Slow tests (embedding model loading, etc.)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["contextos"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
